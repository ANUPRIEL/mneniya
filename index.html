<!doctype html>
<html lang="ru">
<head>

  <title>Мнения — Hybrid Editorial v0.0.3</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{
  --bg:#f6efe7;--paper:#fffaf4;--ink:#401410;--muted:#806d66;
  --accent:#f28f6b;--accent-soft:#f8d7ca;--line:#e5d5cc;
  --danger:#a8382f;--success:#705a47;--shadow:0 22px 70px rgba(64,20,16,.10);
  --radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;background:rgba(246,239,231,.9);backdrop-filter:blur(18px);border-bottom:1px solid rgba(229,213,204,.8)}
.topbar-inner{max-width:1240px;margin:auto;padding:16px 28px;display:flex;align-items:center;gap:24px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.05em;margin-right:auto}
.nav{display:flex;gap:4px}
.nav-btn,.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:10px 14px}
.nav-btn:hover,.nav-btn.active,.icon-btn:hover{background:var(--paper);color:var(--ink)}
.primary,.secondary,.ghost,.danger{border:0;border-radius:999px;padding:12px 18px;font-weight:700}
.primary{background:var(--ink);color:#fff}
.secondary{background:var(--accent);color:var(--ink)}
.ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.danger{background:#f8dfdc;color:var(--danger)}
main{max-width:1240px;margin:auto;padding:48px 28px 90px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--accent)}
.display{font-family:Georgia,"Times New Roman",serif;font-size:clamp(48px,7vw,88px);line-height:.96;letter-spacing:-.055em;font-weight:500;margin:14px 0 20px}
.page-title{font-family:Georgia,"Times New Roman",serif;font-size:50px;line-height:1;letter-spacing:-.045em;font-weight:500;margin:12px 0 20px}
.lead{font-size:20px;color:var(--muted);max-width:720px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:34px;align-items:end;margin-bottom:46px}
.hero-card,.panel,.question-card,.research-card,.notice-card,.stat-card,.publication-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 20px rgba(64,20,16,.025)}
.hero-card{padding:26px}
.hero-card strong{display:block;font-size:48px;letter-spacing:-.05em}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.sidebar{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
.panel{padding:22px}
.panel h3{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.tab,.chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px}
.tab.active,.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.question-card{padding:26px;transition:.2s}
.question-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card-meta{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--muted);font-size:13px;margin-bottom:18px}
.tag{background:var(--accent-soft);padding:6px 10px;border-radius:999px;font-weight:750;color:var(--ink)}
.question-title{font-family:Georgia,"Times New Roman",serif;font-size:31px;line-height:1.14;letter-spacing:-.03em;font-weight:500;margin:0 0 15px}
.question-desc{color:var(--muted);margin:0 0 22px}
.card-footer{display:flex;justify-content:space-between;align-items:center;gap:18px}
.inline-actions{display:flex;gap:8px;flex-wrap:wrap}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini-stat{padding:18px;text-align:center;border:1px dashed #d5b7aa;border-radius:18px}
.mini-stat strong{display:block;font-size:30px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stat-card{min-height:230px;padding:28px;display:flex;flex-direction:column;justify-content:space-between}
.stat-card strong{font-family:Georgia,serif;font-size:86px;font-weight:400;line-height:1;letter-spacing:-.06em}
.form-card{max-width:820px;background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:30px}
.field{margin-bottom:18px}
.field label{display:block;color:var(--muted);font-size:13px;font-weight:750;margin-bottom:8px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);padding:14px 15px;border-radius:15px;outline:none}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(242,143,107,.18)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.helper{background:#f1e5dc;color:var(--muted);border-radius:16px;padding:14px 16px;font-size:13px}
.stepper{display:flex;gap:8px;margin-bottom:24px}
.step{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eadfd7;color:var(--muted);font-weight:800}
.step.active{background:var(--ink);color:#fff}
.answer-block{padding:18px 0;border-top:1px solid var(--line)}
.answer-text{font-size:18px;margin:0 0 8px}
.research-card,.publication-card,.notice-card{padding:24px}
.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#efe3db;font-size:12px;font-weight:800}
.progress{height:8px;background:#eadfd7;border-radius:99px;overflow:hidden;margin:14px 0}
.progress span{display:block;height:100%;background:var(--accent)}
.notification{display:grid;grid-template-columns:12px 1fr auto;gap:14px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:7px}
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(48,24,20,.46);backdrop-filter:blur(5px);z-index:80;display:grid;place-items:center;padding:18px}
.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:28px;padding:28px;box-shadow:0 30px 100px rgba(64,20,16,.3)}
.modal-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}
.modal h2{font-family:Georgia,serif;font-size:35px;line-height:1.05;font-weight:500;margin:0}
.close{border:0;background:#eee1d8;width:38px;height:38px;border-radius:50%;font-size:20px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;background:var(--accent);border-radius:99px;font-size:12px;font-weight:800}
.onboarding{min-height:calc(100vh - 160px);display:grid;place-items:center}
.onboarding-card{max-width:760px;text-align:center}
.onboarding-visual{height:220px;border:1px dashed #d7b9ad;border-radius:28px;display:grid;place-items:center;margin:26px 0;background:rgba(255,250,244,.5)}
.people{font-size:62px;letter-spacing:18px}
.report-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
.chart{height:220px;display:flex;align-items:end;gap:12px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff}
.bar{flex:1;background:var(--accent-soft);border-radius:10px 10px 4px 4px;position:relative;min-height:20px}
.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;margin-bottom:5px}
.mobile-nav{display:none}
@media(max-width:900px){
  .hero,.layout,.report-grid{grid-template-columns:1fr}
  .sidebar{position:static}
  .hero-card{display:none}
  .nav{display:none}
  main{padding:34px 16px 90px}
  .topbar-inner{padding:14px 16px}
  .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(4,1fr);left:12px;right:12px;bottom:12px;background:rgba(255,250,244,.94);backdrop-filter:blur(15px);border:1px solid var(--line);border-radius:20px;padding:8px;z-index:50}
  .mobile-nav button{border:0;background:transparent;padding:9px 4px;border-radius:14px;color:var(--muted);font-size:12px}
  .mobile-nav button.active{background:var(--ink);color:#fff}
}
@media(max-width:620px){
  .display{font-size:52px}.page-title{font-size:42px}.question-title{font-size:26px}
  .grid-2,.grid-3,.stats-row,.form-row{grid-template-columns:1fr}
  .card-footer{align-items:flex-start;flex-direction:column}
  .stat-card strong{font-size:70px}
}


/* v0.0.2 — Typography & UX pass */
.hero{grid-template-columns:minmax(0,1fr) 320px;align-items:stretch}
.hero-card{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.hero-line,.hero-lead span,.section-title span{display:block}
.hero-lead{max-width:760px}
.section-title{font-size:50px;max-width:900px}
.sidebar>.panel{width:100%}
.values-panel .eyebrow{margin-bottom:10px}
.principle-list{display:flex;flex-direction:column}
.principle-list>div{display:grid;grid-template-columns:130px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.principle-list>div:first-child{border-top:0}
.principle-list span{color:var(--muted);font-size:14px}
.principle-list.compact>div{grid-template-columns:1fr;gap:4px;padding:14px 0}
.principle-list.compact span{font-size:13px;line-height:1.45}
.form-card{max-width:920px}
input,select{min-height:58px}
textarea{min-height:142px}
.helper{line-height:1.55}
.back-button{margin-bottom:24px}
.research-meta{margin-top:4px}
.onboarding{min-height:100vh;padding-top:40px;padding-bottom:40px}
.onboarding-card{max-width:940px;width:100%;text-align:left;background:rgba(255,250,244,.42);border:1px solid rgba(229,213,204,.85);border-radius:32px;padding:48px}
.onboarding-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,6vw,72px);line-height:1.02;letter-spacing:-.05em;font-weight:500;margin:14px 0 22px;max-width:900px}
.onboarding-lead{max-width:800px;margin:0}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:34px 0 20px}
.role-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px}
.role-card strong{font-family:Georgia,serif;font-size:25px;font-weight:500}
.role-card p{color:var(--muted);margin:12px 0 0}
.onboarding-note{color:var(--ink);font-weight:650;margin:22px 0 0;max-width:800px}
.onboarding-principles{margin:30px 0 8px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:4px 24px}
.result-path{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 20px}
.result-path>div{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.result-path span{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.12em}
.result-path strong{font-family:Georgia,serif;font-size:22px;font-weight:500}
.onboarding-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:34px}
.onboarding-footer .stepper{margin:0}
.profile-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:20px;margin-bottom:20px}
.profile-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;gap:22px;align-items:center}
.profile-card h2{font-family:Georgia,serif;font-size:34px;font-weight:500;margin:0 0 8px}
.profile-card p{margin:0;max-width:620px}
.avatar{width:78px;height:78px;flex:0 0 78px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);font-family:Georgia,serif;font-size:38px}
.profile-actions{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.profile-actions h3{margin-bottom:4px}
.profile-actions button{text-align:left}
.profile-stats{margin-top:20px}
.mobile-nav{grid-template-columns:repeat(5,1fr)}
@media(max-width:900px){
  .profile-grid{grid-template-columns:1fr}
  .onboarding-card{padding:30px}
  .role-grid,.result-path{grid-template-columns:1fr}
  .hero-line{display:inline}
  .hero-line+ .hero-line:before{content:" ";}
}
@media(max-width:620px){
  .onboarding-card{padding:24px;border-radius:24px}
  .onboarding-title{font-size:43px}

  .principle-list>div{grid-template-columns:1fr;gap:5px}
  .section-title{font-size:42px}
}


/* v0.0.3 — Hybrid Editorial visual system */
:root{
  --bg:#F4EDE4;
  --paper:#FFFDF9;
  --ink:#211B19;
  --muted:#736A65;
  --accent:#E98767;
  --accent-soft:rgba(233,135,103,.14);
  --line:#DCCFC6;
  --danger:#A7473B;
  --success:#5F7568;
  --shadow:none;
  --radius:14px;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.55}
h1,h2,h3,.display,.page-title,.question-title,.onboarding-title,.profile-card h2,.role-card strong,.result-path strong,.modal h2{font-family:'Space Grotesk',sans-serif!important}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.045em}
.eyebrow,.card-meta,.small,.tag,.status,.tab,.chip,.field label,.mini-stat span,.badge,.principle-list strong,.result-path span{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:600;display:flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg);flex:0 0 auto}
.display{font-size:clamp(48px,6.2vw,78px);line-height:1.01;letter-spacing:-.055em;font-weight:600}
.page-title,.section-title{font-size:46px;line-height:1.04;letter-spacing:-.045em;font-weight:600}
.question-title{font-size:29px;line-height:1.18;font-weight:600}
.lead{font-size:18px;line-height:1.62}
.topbar{background:rgba(244,237,228,.92);border-bottom:1px solid var(--line)}
.topbar-inner{padding-top:13px;padding-bottom:13px}
.nav-btn,.icon-btn{border-radius:8px;padding:9px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.nav-btn:hover,.nav-btn.active,.icon-btn:hover{background:var(--paper)}
.primary,.secondary,.ghost,.danger{border-radius:8px;padding:11px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.01em}
.primary{background:var(--ink)}
.secondary{background:var(--accent);color:var(--ink)}
.ghost{background:transparent}
.hero{gap:28px;margin-bottom:40px}
.hero-card,.panel,.question-card,.research-card,.notice-card,.stat-card,.publication-card,.form-card,.profile-card,.role-card,.onboarding-principles,.result-path>div{border-radius:14px;box-shadow:none;background:var(--paper)}
.hero-card{border-left:3px solid var(--accent)}
.hero-card strong,.mini-stat strong,.stat-card strong{font-family:'Space Grotesk',sans-serif;font-weight:600}
.question-card{padding:24px;border-left:3px solid transparent}
.question-card:hover{transform:translateY(-2px);box-shadow:none;border-color:var(--line);border-left-color:var(--accent)}
.card-meta{font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.tag,.status{border-radius:6px;padding:5px 9px;font-size:10.5px;font-weight:600;letter-spacing:.03em}
.tag{background:var(--accent-soft);color:#8A4E3A}
.status{background:#EEE5DE}
.tab,.chip{border-radius:8px;padding:9px 14px;font-size:11px;letter-spacing:.02em}
.tabs{gap:9px}
.stats-row{gap:10px}
.mini-stat{border-style:solid;border-color:var(--line);border-radius:12px;padding:16px}
.mini-stat strong{font-size:29px}
.panel{padding:21px}
.principle-list>div{grid-template-columns:120px 1fr;padding:14px 0}
.principle-list strong{font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stat-card{min-height:220px;padding:25px;border-top:3px solid transparent}
.stat-card:hover{border-top-color:var(--accent)}
.stat-card strong{font-size:78px}
.form-card{padding:28px;max-width:940px}
input,textarea,select{border-radius:10px;background:#fffefa;min-height:56px}
textarea{min-height:142px}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px rgba(233,135,103,.14)}
.helper{border-radius:10px;background:#EFE5DC;border-left:3px solid var(--accent)}
.progress{border-radius:4px;height:7px}
.progress span{border-radius:4px}
.modal{border-radius:16px;box-shadow:0 24px 80px rgba(33,27,25,.22)}
.close{border-radius:8px;background:#EFE5DE}
.toast{border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.onboarding-card{border-radius:16px;background:rgba(255,253,249,.75);padding:44px}
.onboarding-title{font-size:clamp(42px,5.4vw,66px);font-weight:600;letter-spacing:-.05em}
.role-card{border-left:3px solid var(--accent)}
.role-card strong{font-size:22px;font-weight:600}
.result-path>div{border-top:3px solid var(--accent)}
.avatar{border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600}
.mobile-nav{border-radius:14px;background:rgba(255,253,249,.95)}
.mobile-nav button{border-radius:8px;font-family:'IBM Plex Mono',monospace}
@media(max-width:620px){
  .page-title,.section-title{font-size:39px}
  .display{font-size:50px}
  .onboarding-card{border-radius:14px;padding:22px}
}

function completeWithoutPublication(id){state.researches.find(r=>r.id===id).status="Завершено без публикации";save();closeModal();toast("Участникам отправлена благодарность");renderResearch(id)}
function renderContribution(){
  shell(`<div class="eyebrow">Ваш вклад</div><h1 class="page-title section-title"><span>Ваши мнения уже стали частью</span><span>чего-то большего.</span></h1>
    <div class="grid-2">
      <div class="stat-card"><strong>${state.opinionsGiven}</strong><p class="muted">вопросов удостоились вашего мнения</p></div>
      <div class="stat-card"><strong>${state.publicationsHelped}</strong><p class="muted">исследования опубликованы благодаря вашим ответам</p></div>
      <div class="stat-card"><strong>3</strong><p class="muted">темы, к которым вы возвращаетесь чаще всего</p></div>
      <div class="stat-card"><strong>${Math.max(3,Math.round(state.opinionsGiven/3))}</strong><p class="muted">авторов получили ваши мнения для своих работ</p></div>
    </div>
    <div class="panel" style="margin-top:24px"><h3>Как устроена анонимность</h3><p class="muted">Только вы видите собственный профиль. Исследователи получают мнения отдельно от демографических данных, а характеристики аудитории — только в агрегированном виде.</p></div>`);
}
function renderNotifications(){
  state.notifications.forEach(n=>n.unread=false);save();
  shell(`<div class="eyebrow">События</div><h1 class="page-title section-title">Уведомления</h1>
    <div class="panel">${state.notifications.map(n=>`<div class="notification"><span class="dot"></span><div><strong>${n.title}</strong><p class="muted small">${n.text}</p></div><span class="muted small">${n.time}</span></div>`).join("")}</div>`);
}
function renderProfile(){
  shell(`<div class="eyebrow">Профиль</div><h1 class="page-title section-title">Ваше пространство</h1>
    <div class="profile-grid">
      <section class="profile-card">
        <div class="avatar">М</div>
        <div><h2>Анонимный участник</h2><p class="muted">Ваше имя не передаётся авторам вопросов. Здесь хранится только личная история участия.</p></div>
      </section>
      <section class="panel profile-actions"><h3>Управление профилем</h3>
        <button class="ghost" onclick="location.hash='#/settings'">Данные и приватность</button>
        <button class="ghost" onclick="location.hash='#/contribution'">Посмотреть мой вклад</button>
        <button class="ghost" onclick="location.hash='#/researches'">Мои исследования</button>
      </section>
    </div>
    <div class="grid-3 profile-stats">
      <div class="stat-card"><strong>${state.opinionsGiven}</strong><p class="muted">мнений отправлено</p></div>
      <div class="stat-card"><strong>${state.researches.length}</strong><p class="muted">исследования в кабинете</p></div>
      <div class="stat-card"><strong>${state.publicationsHelped}</strong><p class="muted">публикации созданы с вашим участием</p></div>
    </div>`);
}
function renderSettings(){
  shell(`<div class="eyebrow">Настройки</div><h1 class="page-title">Ваши данные и приватность</h1>
    <div class="form-card">
      <div class="field"><label>Возрастная группа</label><select><option>Не указано</option><option>18–24</option><option>25–34</option><option>35–44</option><option>45+</option></select></div>
      <div class="field"><label>Город</label><input placeholder="Необязательно"></div>
      <div class="field"><label>Образование</label><select><option>Не указано</option><option>Среднее</option><option>Высшее</option><option>Учусь сейчас</option></select></div>
      <div class="helper">Эти данные не связываются с конкретными ответами. Они используются только для агрегированных диаграмм.</div>
      <div class="inline-actions" style="margin-top:20px"><button class="primary" onclick="toast('Настройки сохранены')">Сохранить</button><button class="danger" onclick="resetPrototype()">Сбросить прототип</button></div>
    </div>`);
}
function resetPrototype(){localStorage.removeItem(storageKey);location.reload()}
function render404(){shell(`<div class="empty"><h1 class="page-title">Страница не найдена</h1><button class="primary" onclick="location.hash='#/feed'">Вернуться к вопросам</button></div>`)}
function modal(content){$("#modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
function plural(n,one,few,many){const n10=n%10,n100=n%100;return n10===1&&n100!==11?one:n10>=2&&n10<=4&&(n100<12||n100>14)?few:many}
window.addEventListener("hashchange",route);
window.addEventListener("DOMContentLoaded",route);
</script>
</body>
